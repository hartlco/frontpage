services:
  frontpage:
    image: ghcr.io/hartlco/frontpage:latest
    container_name: frontpage
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - ./frontpage-data:/data
      - ~/.ssh/frontpage-data-deploy:/root/.ssh/id_ed25519:ro
      - ~/.ssh/known_hosts:/root/.ssh/known_hosts:ro
    environment:
      - FRONTPAGE_DATA_DIR=/data
      - FRONTPAGE_BASE_URL=https://builds.hartl.co
      - FRONTPAGE_SYNC_INTERVAL=900
      - FRONTPAGE_PORT=8080
      - TZ=Europe/Berlin
