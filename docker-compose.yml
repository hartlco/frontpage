services:
  frontpage:
    image: ghcr.io/hartlco/frontpage:latest
    container_name: frontpage
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - ./frontpage-data:/data
    environment:
      - FRONTPAGE_DATA_DIR=/data
      - FRONTPAGE_BASE_URL=https://builds.example.com
      - FRONTPAGE_SYNC_INTERVAL=900
      - FRONTPAGE_PORT=8080
      - TZ=Europe/Berlin
